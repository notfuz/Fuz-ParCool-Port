org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.21.4
neo_version=21.4.158
loader_version=0.16.14
fabric_api_version=0.119.4+1.21.4

# Architectury
# 15.0.3 is the Architectury that actually runs on Minecraft 1.21.4. The version predicate alone is
# not enough to tell, because architectury-fabric 15.0.3 AND 16.0.1/16.0.2/16.0.3/16.1.4 all declare
# depends.minecraft = "~1.21.4-" in their fabric.mod.json. Reading what each one actually drags in
# and what its own mixins target separates them:
#
#   version  minecraft   fabric-api it pulls   refmap target of FarmBlock.fallOn   runs on 1.21.4?
#   14.0.4   ~1.21.2-    0.106.1+1.21.2         F                                  no (too old)
#   15.0.3   ~1.21.4-    0.110.5+1.21.4         F                                  YES
#   16.0.1   ~1.21.4-    0.119.0+1.21.5         D                                  no
#   16.0.2   ~1.21.4-    0.119.3+1.21.5         D                                  no
#   16.0.3   ~1.21.4-    0.119.5+1.21.5         D                                  no
#   16.1.4   ~1.21.4-    0.119.5+1.21.5         D                                  no
#   17.0.3   ~1.21.6~    0.127.0+1.21.6         D                                  no (too new)
#
# "F"/"D" is the last parameter of FarmBlock#fallOn in the target of architectury.mixins.json's
# MixinFarmBlock, read out of each architectury-fabric-<v>.jar's architectury-fabric-refmap.json.
# javap on the 1.21.4 dev jar shows what 1.21.4 really has:
#     public void fallOn(Level, BlockState, BlockPos, Entity, float)
# and javap on the 1.21.7 / 1.21.9 dev jars shows the same method with a double. So 16.x is a 1.21.5
# build wearing a "~1.21.4-" label - its pom pulls a 1.21.5 fabric-api and its refmap asks for the
# post-1.21.4 signature. Loading it on 1.21.4 hard-crashes during Blocks.<clinit>, before the window
# exists, from Architectury's OWN mixin rather than from ParCool:
#     Mixin apply for mod architectury failed architectury.mixins.json:MixinFarmBlock from mod
#       architectury -> net.minecraft.world.level.block.FarmBlock: InvalidInjectionException:
#       Injection validation failed: @Inject annotation on fallOn could not find any targets
#       matching 'Lnet/minecraft/world/level/block/FarmBlock;method_9554(Lnet/minecraft/world/level/
#       Level;Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/core/BlockPos;
#       Lnet/minecraft/world/entity/Entity;D)V' in net.minecraft.world.level.block.FarmBlock.
#       Using refmap architectury-fabric-refmap.json
#     #@!@# Game crashed! Crash report saved to: .../run/crash-reports/crash-...-client.txt
# 15.0.3 fixes that as a side effect: its 0.110.5+1.21.4 is BELOW the 0.119.4+1.21.4 this port pins,
# so Gradle's "highest version wins" now keeps the port's own fabric-api and the substitution that
# caused the original defect cannot happen at all - no exclude, no resolutionStrategy needed.
#
# architectury-neoforge 15.0.3 requires MC [1.21.4,) / NF [21.0.110-beta,), which accepts
# 21.4.158, and the 18 dev.architectury classes ParCool references have byte-identical javap
# signatures in architectury{,-fabric,neoforge} 15.0.3 and 16.1.4 - so the downgrade costs no API.
architectury_api_version=15.0.3

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
